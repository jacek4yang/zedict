name: Bug 报告
description: 报告可复现的错误行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先使用 `zedict doctor` 与最新 Release 复现。不要粘贴词库正文、API key 或个人路径。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 发生了什么，期望是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 给出最小命令、输入和必要参数。
      placeholder: |
        1. zedict ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 实际结果
      description: 附上错误输出或退出码（0/1/2/3/130）。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: Release 标签或 `zedict --version` 输出。
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 平台
      description: 操作系统与架构，例如 Windows 11 x64、macOS 14 ARM64、Ubuntu 24.04 x64。
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: 构建方式
      options:
        - 官方 Release 压缩包
        - 源码 `cargo build --release`
        - 源码 `cargo build --release --features server`
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: doctor 输出
      description: 可选。只保留计数与状态，不要附词库正文。
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 已搜索现有 issue，未发现重复。
          required: true
        - label: 输出中不含词库正文、密钥或个人信息。
          required: true
