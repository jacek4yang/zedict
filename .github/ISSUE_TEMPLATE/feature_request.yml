name: 功能建议
description: 提出新能力或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪里不方便？请描述使用场景，而不只是实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 命令、输出格式或配置应如何变化？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 可选。你考虑过的其他做法或现有绕过方式。
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 该功能可以离线工作，或联网为可选且有明确失败回退。
          required: true
        - label: 不要求实现欧陆账号登录、复用其私有密钥或分发其词库内容。
          required: true
